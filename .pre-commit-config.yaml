repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.49
    hooks:
      - id: ty
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -n 6
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

# Example of the keybind configuration proposed in issue #234.
# Printable keys use their character; other keys use Textual's key names.

[global]
"q" = "app.quit"
"ctrl+q" = "app.quit"
"ctrl+p" = "app.command_palette"
"ctrl+z" = "app.suspend_process"

[main]
"z" = "plugin_zoxide"
"f" = "plugin_fd"
"\\" = "plugin_rg"
"S" = "app.toggle_pinned_sidebar"
"I" = "app.toggle_preview_sidebar"
"F" = "app.toggle_footer"
"M" = "app.toggle_menu_wrapper"
"s" = "app.focus_toggle_pinned_sidebar"
"escape" = "app.focus_file_list"
"i" = "app.focus_toggle_preview_sidebar"
"ctrl+l" = "app.focus_toggle_path_switcher"
"#" = "app.focus_toggle_processes"
"c" = "app.focus_toggle_clipboard"
"m" = "app.focus_toggle_metadata"
"ctrl+j" = "app.cycle_tab(1)"
"ctrl+k" = "app.cycle_tab(-1)"
"n" = "app.tab_new"
"w" = "app.tab_close"
"?" = "app.show_keybinds"
">" = "app.show_shell_screen"

[file_list]
"P" = "toggle_pin"
"/" = "focus_search"
"y" = "copy.to_rovr"
"ctrl+c" = "copy.to_rovr"
"p" = "paste"
"ctrl+v" = "paste"
"x" = "cut"
"ctrl+x" = "cut"
"d" = "delete"
"delete" = "delete"
"r" = "rename"
"f2" = "rename"
"ctrl+n" = "new"
"a" = "new"
"N" = "bulk_create"
"A" = "bulk_create"
"E" = "zip"
"ctrl+e" = "unzip"
"left" = "up_tree"
"h" = "up_tree"
"H" = "bypass_up_tree"
"L" = "bypass_down_tree"
"backspace" = "hist_previous"
"u" = "hist_previous"
"space" = "hist_next"
"v" = "toggle_visual"
"%" = "toggle_all"
"ctrl+a" = "toggle_all"
"." = "toggle_hidden_files"
"insert" = "toggle_select_item"
"shift+up" = "select_cursor(-1)"
"K" = "select_cursor(-1)"
"shift+down" = "select_cursor(1)"
"J" = "select_cursor(1)"
"shift+pageup" = "select_cursor_page(-1)"
"shift+pagedown" = "select_cursor_page(1)"
"shift+home" = "select_home"
"shift+end" = "select_end"
"o" = "open"
"e" = "open_editor"
"shift+f10" = "open_right_click_menu"
"Y" = "copy.open_popup"
"," = "sort_order.open_popup"

[pinned_sidebar]
"/" = "focus_search"

[lists]
"up" = "cursor(-1)"
"k" = "cursor(-1)"
"down" = "cursor(1)"
"j" = "cursor(1)"
"right" = "select"
"l" = "select"
"enter" = "select"
"pageup" = "cursor_page(-1)"
"ctrl+b" = "cursor_page(-1)"
"pagedown" = "cursor_page(1)"
"ctrl+f" = "cursor_page(1)"
"home" = "first"
"g" = "first"
"end" = "last"
"G" = "last"

[copy_menu]
"y" = "copy.to_rovr"
"p" = "copy.highlighted"
"s" = "copy.to_system_clip"
"d" = "copy.current_directory"

[sort_menu]
"a" = "sort_order.name"
"e" = "sort_order.extension"
"n" = "sort_order.natural"
"s" = "sort_order.size"
"c" = "sort_order.created"
"m" = "sort_order.modified"
"d" = "sort_order.descending"

[delete_files]
"d" = "trash"
"x" = "delete"
"c" = "cancel"
"escape" = "cancel"

[trash]
"r" = "restore"
"x" = "purge"
"E" = "empty"
"c" = "cancel"
"escape" = "cancel"

[filename_conflict]
"o" = "overwrite"
"s" = "skip"
"r" = "rename"
"c" = "cancel"
"escape" = "cancel"
"a" = "dont_ask_again"

[file_in_use]
"r" = "retry"
"s" = "skip"
"c" = "cancel"
"escape" = "cancel"
"a" = "toggle_dont_ask_again"

[filter_modal]
"escape" = "exit"
"down" = "cursor(1)"
"ctrl+j" = "cursor(1)"
"up" = "cursor(-1)"
"ctrl+k" = "cursor(-1)"
"pageup" = "cursor_page(-1)"
"ctrl+b" = "cursor_page(-1)"
"pagedown" = "cursor_page(1)"
"ctrl+f" = "cursor_page(1)"

[keybinds]
"/" = "focus_search"
"?" = "exit"

[yes_or_no]
"y" = "yes"
"n" = "no"
"escape" = "no"
"a" = "dont_ask_again"

[paste_drop]
"c" = "copy"
"m" = "move"
"escape" = "cancel"

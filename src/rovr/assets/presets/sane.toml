# Conventional GUI-style keybindings

[global]
"ctrl+q" = { action = "app.quit", desc = "Quit rovr" }
"ctrl+p" = { action = "app.command_palette", desc = "Open the command palette" }
"ctrl+z" = { action = "app.suspend_process", desc = "Suspend rovr" }
"tab" = { action = "app.focus_next", desc = "Focus the next widget" }
"shift+tab" = { action = "app.focus_previous", desc = "Focus the previous widget" }

[main]
"S" = { action = "toggle_pinned_sidebar", desc = "Toggle the pinned sidebar" }
"I" = { action = "toggle_preview_sidebar", desc = "Toggle the preview sidebar" }
"F" = { action = "toggle_footer", desc = "Toggle the footer" }
"M" = { action = "toggle_menu_wrapper", desc = "Toggle the menu" }
"s" = { action = "focus_toggle_pinned_sidebar", desc = "Focus the pinned sidebar" }
"escape" = { action = "focus_file_list", desc = "Focus the file list" }
"i" = { action = "focus_toggle_preview_sidebar", desc = "Focus the preview sidebar" }
"ctrl+l" = { action = "focus_toggle_path_switcher", desc = "Focus the path switcher" }
"p" = { action = "focus_toggle_processes", desc = "Focus the processes panel" }
"c" = { action = "focus_toggle_clipboard", desc = "Focus the clipboard panel" }
"m" = { action = "focus_toggle_metadata", desc = "Focus the metadata panel" }
"[" = { action = "cycle_tab(1)", desc = "Go to the next tab" }
"]" = { action = "cycle_tab(-1)", desc = "Go to the previous tab" }
"ctrl+t" = { action = "tab_new", desc = "Open a new tab" }
"ctrl+w" = { action = "tab_close", desc = "Close the current tab" }
"f1" = { action = "show_keybinds", desc = "Show keybindings" }
">" = { action = "show_shell_screen", desc = "Open the shell" }
"z" = { action = "cd_zoxide", desc = "Jump to a directory" }
"f" = { action = "search_fd", desc = "Search for files" }
"\\" = { action = "search_rg", desc = "Search file contents" }

[file_list]
"P" = { action = "toggle_pin", desc = "Toggle the current pin" }
"ctrl+f" = { action = "focus_search", desc = "Search the file list" }
"ctrl+c" = { action = "copy.to_rovr", desc = "Copy selected files" }
"ctrl+v" = { action = "paste", desc = "Paste copied files" }
"ctrl+x" = { action = "cut", desc = "Cut selected files" }
"delete" = { action = "delete", desc = "Delete selected files" }
"f2" = { action = "rename", desc = "Rename the current file" }
"ctrl+n" = { action = "new", desc = "Create a file or directory" }
"alt+n" = { action = "bulk_create", desc = "Create multiple files or directories" }
"E" = { action = "zip", desc = "Create an archive" }
"ctrl+e" = { action = "unzip", desc = "Extract an archive" }
"left" = { action = "up_tree", desc = "Go to the parent directory" }
"alt+up" = "up_tree"
"H" = { action = "bypass_up_tree", desc = "Go up through single folders" }
"shift+left" = "bypass_up_tree"
"L" = { action = "bypass_down_tree", desc = "Go down through single folders" }
"shift+right" = "bypass_down_tree"
"alt+left" = { action = "hist_previous", desc = "Go to the previous directory" }
"backspace" = "hist_previous"
"alt+right" = { action = "hist_next", desc = "Go to the next directory" }
"ctrl+space" = { action = "toggle_visual", desc = "Toggle visual selection" }
"ctrl+a" = { action = "toggle_all", desc = "Toggle selection of all files" }
"." = { action = "toggle_hidden_files", desc = "Toggle hidden files" }
"insert" = { action = "toggle_select_item", desc = "Toggle the current selection" }
"space" = "toggle_select_item"
"shift+up" = { action = "select_cursor(-1)", desc = "Extend selection upward" }
"shift+down" = { action = "select_cursor(1)", desc = "Extend selection downward" }
"shift+pageup" = { action = "select_cursor_page(-1)", desc = "Extend selection up one page" }
"shift+pagedown" = { action = "select_cursor_page(1)", desc = "Extend selection down one page" }
"shift+home" = { action = "select_home", desc = "Extend selection to the first file" }
"shift+end" = { action = "select_end", desc = "Extend selection to the last file" }
"o" = { action = "open", desc = "Open selected files" }
"ctrl+o" = { action = "open_editor", desc = "Open the current file in an editor" }
"shift+f10" = { action = "open_right_click_menu", desc = "Open the context menu" }

[file_list.C]
desc = "Copy"
"r" = { action = "copy.to_rovr", desc = "Copy files to the rovr clipboard" }
"p" = { action = 'copy.text("%h")', desc = "Copy the highlighted file path" }
"s" = { action = "copy.to_system_clip", desc = "Copy files to the system clipboard" }
"d" = { action = 'copy.text("%cwd")', desc = "Copy the current directory path" }

[file_list.","]
desc = "Sort order"
"a" = { action = "sort_order.name", desc = "Sort by name" }
"e" = { action = "sort_order.extension", desc = "Sort by extension" }
"n" = { action = "sort_order.natural", desc = "Sort naturally" }
"s" = { action = "sort_order.size", desc = "Sort by size" }
"c" = { action = "sort_order.created", desc = "Sort by creation time" }
"m" = { action = "sort_order.modified", desc = "Sort by modification time" }
"d" = { action = "sort_order.descending", desc = "Toggle descending order" }

[pinned_sidebar]
"ctrl+f" = { action = "focus_search", desc = "Search pinned directories" }

[lists]
"up" = { action = "cursor(-1)", desc = "Move up" }
"down" = { action = "cursor(1)", desc = "Move down" }
"right" = { action = "select", desc = "Select" }
"enter" = "select"
"pageup" = { action = "cursor_page(-1)", desc = "Move up one page" }
"pagedown" = { action = "cursor_page(1)", desc = "Move down one page" }
"home" = { action = "first", desc = "Move to the first item" }
"end" = { action = "last", desc = "Move to the last item" }

[preview]
"up" = "up"
"down" = "down"
"left" = "left"
"right" = "right"
"pageup" = "page_up"
"pagedown" = "page_down"
"home" = "home"
"end" = "end"

[scroll]
"up" = "scroll_up"
"down" = "scroll_down"
"pageup" = "scroll_page_up"
"pagedown" = "scroll_page_down"
"home" = "scroll_home"
"end" = "scroll_end"

[copy_menu]
"r" = "copy.to_rovr"
"p" = "copy.highlighted"
"s" = "copy.to_system_clip"
"u" = "copy.current_directory"

[sort_menu]
"a" = "sort_order.name"
"e" = "sort_order.extension"
"n" = "sort_order.natural"
"s" = "sort_order.size"
"c" = "sort_order.created"
"m" = "sort_order.modified"
"d" = "sort_order.descending"

[delete_files]
"d" = "trash"
"D" = "delete"
"escape" = "cancel"

[trash]
"r" = "restore"
"D" = "purge"
"E" = "empty"
"escape" = "cancel"

[filename_conflict]
"o" = "overwrite"
"s" = "skip"
"r" = "rename"
"escape" = "cancel"
"a" = "dont_ask_again"

[file_in_use]
"r" = "retry"
"s" = "skip"
"escape" = "cancel"
"a" = "toggle_dont_ask_again"

[filter_modal]
"escape" = "exit"
"down" = "cursor(1)"
"up" = "cursor(-1)"
"pageup" = "cursor_page(-1)"
"pagedown" = "cursor_page(1)"

[inputs]
"left" = "cursor_left"
"shift+left" = "cursor_left(True)"
"ctrl+left" = "cursor_left_word"
"ctrl+shift+left" = "cursor_left_word(True)"
"right" = "cursor_right"
"shift+right" = "cursor_right(True)"
"ctrl+right" = "cursor_right_word"
"ctrl+shift+right" = "cursor_right_word(True)"
"backspace" = "delete_left"
"ctrl+shift+a" = "select_all"
"home" = "home"
"ctrl+a" = "home"
"end" = "end"
"ctrl+e" = "end"
"shift+home" = "home(True)"
"shift+end" = "end(True)"
"delete" = "delete_right"
"ctrl+d" = "delete_right"
"enter" = "submit"
"ctrl+w" = "delete_left_word"
"ctrl+u" = "delete_left_all"
"super+backspace" = "delete_left_all"
"ctrl+backspace" = "delete_left_word"
"alt+backspace" = "delete_left_word"
"ctrl+k" = "delete_right_all"
"ctrl+x" = "cut"
"ctrl+c" = "copy"
"super+c" = "copy"
"ctrl+v" = "paste"

[keybinds]
"ctrl+f" = "focus_search"
"f1" = "exit"

[yes_or_no]
"y" = "yes"
"enter" = "yes"
"n" = "no"
"escape" = "no"
"a" = "dont_ask_again"

[paste_drop]
"c" = "copy"
"m" = "move"
"escape" = "cancel"

[shell_exec]
"tab" = "cycle_mode"
"shift+tab" = "cycle_mode"

[button]
"enter" = "press"
